# Render blueprint for KeySync (free tier, Docker).
services:
  - type: web
    name: keysync
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRANSCRIBE_SERVICE_URL
        # Private service-to-service URL; Render resolves the host internally.
        value: https://keysync-transcribe.onrender.com

  - type: web
    name: keysync-transcribe
    runtime: docker
    dockerfilePath: ./transcribe-service/Dockerfile
    dockerContext: ./transcribe-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
